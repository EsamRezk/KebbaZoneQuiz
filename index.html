<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://kebbazone.com/wp-content/uploads/2022/12/cropped-download-removebg-preview__1___1_-removebg-preview-149x165.png">
<title>اختبار موظفي كبة زون 🧆</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --red: #C0392B;
  --red-dark: #922B21;
  --red-light: #E74C3C;
  --orange: #E67E22;
  --orange-light: #F39C12;
  --cream: #FDFAF5;
  --cream-dark: #F5EFE0;
  --cream-border: #E8D5B0;
  --text-dark: #2C1810;
  --text-mid: #5D3A2A;
  --text-light: #8B5E4A;
  --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--cream);
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* خلفية نقاط زخرفية */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image:
    radial-gradient(circle, rgba(192,57,43,0.06) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}

/* شريط أحمر علوي وسفلي */
.top-bar {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, var(--red-dark), var(--orange), var(--red-dark));
  z-index: 100;
}

.bottom-bar {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--orange), var(--red), var(--orange));
  z-index: 100;
}

.container {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.card {
  background: var(--white);
  border: 2px solid var(--cream-border);
  border-radius: 20px;
  padding: 36px 28px;
  max-width: 520px;
  width: 100%;
  box-shadow:
    0 4px 0 var(--red),
    0 8px 40px rgba(192,57,43,0.12),
    0 2px 8px rgba(0,0,0,0.06);
  animation: cardIn 0.5s ease-out;
  overflow: hidden;
  position: relative;
}

/* زخرفة زاوية */
.card::before {
  content: '🧆';
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 1.4rem;
  opacity: 0.15;
}

.card::after {
  content: '🧆';
  position: absolute;
  bottom: 14px;
  right: 16px;
  font-size: 1.4rem;
  opacity: 0.15;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* اللوجو */
.logo-wrap {
  text-align: center;
  margin-bottom: 8px;
  background: transparent;
}

.logo-wrap img {
  width: 100px;
  height: auto;
  filter: drop-shadow(0 8px 20px rgba(192,57,43,0.4)) drop-shadow(0 4px 8px rgba(0,0,0,0.2)) drop-shadow(2px 2px 0 rgba(150,30,20,0.3));
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.red-divider {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--red), var(--orange), transparent);
  margin: 14px auto;
  border-radius: 2px;
}

h1 {
  font-family: 'Amiri', serif;
  font-size: 1.9rem;
  text-align: center;
  color: var(--red-dark);
  line-height: 1.4;
}

.subtitle {
  text-align: center;
  color: var(--text-light);
  font-size: 0.88rem;
  margin-top: 5px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.input-group { margin-top: 26px; }

.input-group label {
  display: block;
  color: var(--red-dark);
  font-size: 0.88rem;
  margin-bottom: 8px;
  font-weight: 900;
  letter-spacing: 0.5px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: var(--cream);
  border: 2px solid var(--cream-border);
  border-radius: 10px;
  color: var(--text-dark);
  font-family: 'Tajawal', sans-serif;
  font-size: 1.05rem;
  outline: none;
  transition: all 0.3s;
  text-align: right;
}

.input-group input:focus {
  border-color: var(--red);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
}

.input-group input::placeholder { color: var(--text-light); }

.btn {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  background: linear-gradient(135deg, var(--red-dark), var(--red-light));
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Tajawal', sans-serif;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 0 var(--red-dark), 0 6px 16px rgba(192,57,43,0.3);
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.4s;
}

.btn:hover::before { left: 100%; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--red-dark), 0 10px 24px rgba(192,57,43,0.35); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--red-dark); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

/* Question screen */
.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.q-badge {
  background: var(--red-dark);
  color: white;
  padding: 5px 14px;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 900;
  white-space: nowrap;
}

.progress-dots {
  display: flex;
  gap: 4px;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--cream-border);
  border: 1px solid #D5B896;
  transition: all 0.3s;
  flex-shrink: 0;
}

.dot.active {
  background: var(--red);
  border-color: var(--red);
  box-shadow: 0 0 6px rgba(192,57,43,0.5);
}

.dot.done {
  background: var(--orange);
  border-color: var(--orange);
}

.question-text {
  font-family: 'Amiri', serif;
  font-size: 1.35rem;
  line-height: 1.8;
  color: var(--text-dark);
  margin-bottom: 22px;
  text-align: center;
  min-height: 80px;
  padding: 16px;
  background: var(--cream);
  border-radius: 12px;
  border-right: 4px solid var(--red);
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.option-btn {
  padding: 13px 10px;
  background: var(--cream);
  border: 2px solid var(--cream-border);
  border-radius: 10px;
  color: var(--text-dark);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.92rem;
  cursor: pointer;
  transition: all 0.22s;
  text-align: center;
  line-height: 1.4;
  font-weight: 700;
}

.option-btn:hover:not(:disabled) {
  background: rgba(192,57,43,0.06);
  border-color: var(--red);
  color: var(--red-dark);
  transform: scale(1.02);
}

.option-btn.correct {
  background: #EAFAF1;
  border-color: #27AE60;
  color: #1E8449;
  animation: pulse-green 0.4s ease;
}

.option-btn.wrong {
  background: #FDEDEC;
  border-color: var(--red-light);
  color: var(--red-dark);
  animation: shake 0.4s ease;
}

.option-btn.reveal {
  background: #EAFAF1;
  border-color: rgba(39,174,96,0.5);
  color: #1E8449;
}

@keyframes pulse-green {
  0% { transform: scale(1); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.feedback-msg {
  text-align: center;
  font-size: 0.88rem;
  font-weight: 700;
  min-height: 34px;
  padding: 8px 10px;
  border-radius: 8px;
  transition: all 0.3s;
  line-height: 1.5;
}

.feedback-msg.correct {
  background: #EAFAF1;
  color: #1E8449;
  border: 1px solid rgba(39,174,96,0.3);
}

.feedback-msg.wrong {
  background: #FDEDEC;
  color: var(--red-dark);
  border: 1px solid rgba(192,57,43,0.2);
}

.score-circles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
  margin: 10px 0;
}

.score-circle {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
}

/* Result / Invitation */
.invitation-card {
  background: linear-gradient(145deg, #FFF8F0, #FFF3E8);
  border: 2px solid var(--cream-border);
  border-radius: 16px;
  padding: 24px 18px;
  text-align: center;
  margin: 14px 0;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(192,57,43,0.08);
}

.invitation-card::before {
  content: '✦';
  position: absolute;
  top: 10px; right: 14px;
  color: var(--red);
  opacity: 0.25;
  font-size: 1.2rem;
}

.invitation-card::after {
  content: '✦';
  position: absolute;
  bottom: 10px; left: 14px;
  color: var(--orange);
  opacity: 0.25;
  font-size: 1.2rem;
}

.invitation-name {
  font-family: 'Amiri', serif;
  font-size: 1.55rem;
  color: var(--red-dark);
  margin-bottom: 6px;
  font-weight: 700;
}

.invitation-body {
  font-family: 'Amiri', serif;
  font-size: 0.98rem;
  line-height: 1.8;
  color: var(--text-mid);
}

.invitation-detail {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 7px 0;
  font-size: 0.92rem;
  flex-wrap: wrap;
}

.invitation-detail .icon { font-size: 1rem; }
.invitation-detail .detail-label { color: var(--red-dark); font-weight: 900; }
.invitation-detail .detail-val { color: var(--text-mid); }

/* Leaderboard */
.leaderboard-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
  table-layout: fixed;
}

.leaderboard-table th {
  color: var(--red-dark);
  font-size: 0.8rem;
  padding: 8px 4px;
  border-bottom: 2px solid var(--cream-border);
  text-align: right;
  font-weight: 900;
  background: var(--cream);
}

.leaderboard-table th:nth-child(1) { width: 38px; text-align: center; }
.leaderboard-table th:nth-child(2) { width: auto; }
.leaderboard-table th:nth-child(3) { width: 88px; text-align: center; }

.leaderboard-table td {
  padding: 10px 4px;
  border-bottom: 1px solid var(--cream-dark);
  font-size: 0.85rem;
  color: var(--text-dark);
  vertical-align: middle;
}

.leaderboard-table td:nth-child(1) { text-align: center; }
.leaderboard-table td:nth-child(3) { text-align: center; }

.leaderboard-table tr:hover td { background: rgba(192,57,43,0.03); }

.stars-cell {
  display: block;
  font-size: 0.7rem;
  line-height: 1.5;
  word-break: break-all;
}

.score-text {
  font-size: 0.85rem;
  font-weight: 900;
  display: block;
}

.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 0.82rem;
  font-weight: 900;
}

.rank-1 { background: linear-gradient(135deg, #F39C12, #E67E22); color: white; box-shadow: 0 2px 6px rgba(230,126,34,0.4); }
.rank-2 { background: #A8A9AD; color: white; }
.rank-3 { background: #CD7F32; color: white; }
.rank-other { background: var(--cream-dark); color: var(--text-mid); border: 1px solid var(--cream-border); }

.screen { display: none; }
.screen.active { display: block; }

.tab-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.tab-btn {
  flex: 1;
  padding: 11px 8px;
  background: var(--cream);
  border: 2px solid var(--cream-border);
  border-radius: 10px;
  color: var(--text-mid);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.25s;
  font-weight: 700;
}

.tab-btn:hover {
  background: rgba(192,57,43,0.06);
  border-color: var(--red);
  color: var(--red-dark);
}

.loading {
  text-align: center;
  padding: 30px;
  color: var(--text-light);
  font-size: 0.95rem;
}

.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  top: -10px;
}

@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* score big */
#scoreBig {
  text-align: center;
  font-size: 3rem;
  color: var(--red-dark);
  font-weight: 900;
  margin: 8px 0;
}
</style>
</head>

<div class="bottom-bar"></div>

<div class="confetti-container" id="confetti"></div>

<div class="container">

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  const errorEl = document.getElementById('nameError');
  const btn = document.getElementById('startBtn');
  errorEl.style.display = 'none';
  document.getElementById('nameInput').style.borderColor = '';

  if (!name) {
    document.getElementById('nameInput').style.borderColor = 'var(--red)';
    errorEl.textContent = '⚠️ من فضلك اكتب اسمك الكريم';
    errorEl.style.display = 'block';
    return;
  }

  const isAdmin = name === ADMIN_NAME;

  if (!isAdmin && useDB) {
    btn.textContent = '⏳ جاري التحقق...';
    btn.disabled = true;
    try {
      const { data } = await sbClient.from('employee_quiz_results').select('id').ilike('name', name).limit(1);
      if (data && data.length > 0) {
        errorEl.innerHTML = `⛔ الاسم <strong>"${escHtml(name)}"</strong> مسجّل مسبقاً<br><span style="font-size:0.85rem;opacity:0.8;">كل موظف يجيب على الاختبار مرة واحدة فقط 🧆</span>`;
        errorEl.style.display = 'block';
        document.getElementById('nameInput').style.borderColor = 'var(--red)';
        btn.textContent = 'ابدأ المسابقة ✨';
        btn.disabled = false;
        return;
      }
    } catch(e) {}
    btn.textContent = 'ابدأ المسابقة ✨';
    btn.disabled = false;
  }

  userName = name;
  document.getElementById('leaderboardBtnRow').style.display = isAdmin ? 'flex' : 'none';
  currentQ = 0; score = 0; answers = [];
  loadQuestion();
  showScreen('screen-question');
}

function loadQuestion() {
  const q = questions[currentQ];
  answered = false;
  document.getElementById('qBadge').textContent = `السؤال ${currentQ + 1} من ${questions.length}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';

  for (let i = 0; i < questions.length; i++) {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'dot';
    if (i < currentQ) dot.classList.add('done');
    if (i === currentQ) dot.classList.add('active');
  }

  const sc = document.getElementById('scoreCircles');
  sc.innerHTML = answers.map(a =>
    `<div class="score-circle" style="background:${a?'#EAFAF1':'#FDEDEC'};border:1px solid ${a?'#27AE60':'#E74C3C'}">${a?'✅':'❌'}</div>`
  ).join('');

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });
}

function selectAnswer(idx, btnEl) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correct;
  if (isCorrect) {
    score++;
    btnEl.classList.add('correct');
    document.getElementById('feedbackMsg').textContent = '✅ إجابة صحيحة! أحسنت';
    document.getElementById('feedbackMsg').className = 'feedback-msg correct';
  } else {
    btnEl.classList.add('wrong');
    btns[q.correct].classList.add('reveal');
    document.getElementById('feedbackMsg').innerHTML = `❌ الإجابة: ${q.options[q.correct]}<br><small style="font-size:0.8rem;opacity:0.85;">${q.explanation}</small>`;
    document.getElementById('feedbackMsg').className = 'feedback-msg wrong';
  }
  answers.push(isCorrect);

  setTimeout(() => {
    currentQ++;
    currentQ < questions.length ? loadQuestion() : showResult();
  }, 2200);
}

async function showResult() {
  const pctScore = Math.round((score / questions.length) * 100);
  const titles = pctScore >= 95 ? ['ما شاء الله! متفوق! 🏆'] : pctScore >= 85 ? ['ممتاز! أحسنت! 💪'] : pctScore >= 70 ? ['جيد جداً! 🌟'] : pctScore >= 50 ? ['مقبول، تقدر تحسن! 👍'] : ['تحتاج مراجعة أكثر 📚'];
  document.getElementById('resultTitle').textContent = titles[0];
  document.getElementById('scoreBig').textContent = `${score} / ${questions.length}`;
  document.getElementById('invName').textContent = `أحسنت يا ${userName}! 🎉`;
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('resultScoreText').textContent = `${score} / ${questions.length} سؤال`;
  const ratings = [
    [0,  49,  '😕 تحتاج مراجعة'],
    [50, 69,  '👍 مقبول'],
    [70, 84,  '🌟 جيد جداً'],
    [85, 94,  '💪 ممتاز'],
    [95, 100, '🏆 متفوق!']
  ];
  const r = ratings.find(([mn, mx]) => pct >= mn && pct <= mx);
  document.getElementById('resultRating').textContent = r ? r[2] : '';
  showScreen('screen-result');

  const isAdmin = userName === ADMIN_NAME;
  const adminRow = document.getElementById('adminLeaderboardRow');
  if (adminRow) adminRow.style.display = isAdmin ? 'flex' : 'none';
  if (score === questions.length) launchConfetti();

  if (useDB) {
    try {
      const pctVal = Math.round((score / questions.length) * 100);
      const { error: insertError } = await sbClient.from('employee_quiz_results').insert({
        name: userName,
        correct: score,
        total: questions.length,
        percentage: pctVal
      });
      if (insertError) console.error('Insert error:', insertError);
      else console.log('✅ Saved to DB');
    } catch(e) { console.error('DB error:', e); }
  } else {
    const results = JSON.parse(localStorage.getItem('employee_quiz_results') || '[]');
    results.push({ name: userName, score, total: questions.length, created_at: new Date().toISOString() });
    localStorage.setItem('employee_quiz_results', JSON.stringify(results));
  }
}

async function showLeaderboard() {
  if (userName !== ADMIN_NAME) return;
  showScreen('screen-leaderboard');
  await loadLeaderboard();
}

async function loadLeaderboard() {
  const el = document.getElementById('leaderboardContent');
  el.innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';
  let results = [];

  if (useDB) {
    try {
      const { data, error } = await sbClient.from('employee_quiz_results').select('*').order('correct', { ascending: false }).order('created_at', { ascending: true });
      if (!error) results = data || [];
    } catch(e) {}
  } else {
    results = JSON.parse(localStorage.getItem('employee_quiz_results') || '[]');
    results.sort((a,b) => b.correct - a.correct || new Date(a.created_at) - new Date(b.created_at));
  }

  if (results.length === 0) {
    el.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:30px;">لا توجد نتائج بعد 🧆<br>كن أول المشاركين!</p>';
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  const rankClass = i => i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';
  const starsHtml = n => n <= 5 ? '⭐'.repeat(n) : '⭐'.repeat(5) + '<br>' + '⭐'.repeat(n-5);

  el.innerHTML = `
    <table class="leaderboard-table">
      <thead><tr><th>#</th><th>الاسم</th><th>النتيجة</th></tr></thead>
      <tbody>
        ${results.map((r, i) => `
          <tr>
            <td><span class="rank-badge ${rankClass(i)}">${i < 3 ? medals[i] : i+1}</span></td>
            <td>
              <div style="font-weight:${i===0?'900':'700'};color:${i===0?'var(--red-dark)':'var(--text-dark)'};">${escHtml(r.name)}</div>
              <div style="font-size:0.72rem;color:var(--text-light);margin-top:2px;">🕐 ${formatDate(r.created_at)}</div>
            </td>
            <td>
              <span class="score-text" style="color:${r.correct===20?'var(--red-dark)':r.correct>=14?'#27AE60':'var(--text-light)'};">${r.correct} / ${r.total}</span>
              <span class="stars-cell">${starsHtml(r.correct)}</span>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ${!useDB ? '<p style="text-align:center;margin-top:14px;font-size:0.78rem;color:var(--text-light);">⚠️ وضع المعاينة - بيانات محلية</p>' : ''}
  `;
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function launchConfetti() {
  const colors = ['#C0392B','#E74C3C','#E67E22','#F39C12','#27AE60','#2980B9'];
  const container = document.getElementById('confetti');
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()}s;width:${Math.random()*10+4}px;height:${Math.random()*10+4}px;border-radius:${Math.random()>0.5?'50%':'2px'};`;
    container.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

document.getElementById('nameInput').addEventListener('input', function() {
  const val = this.value.trim();
  const isAdmin = val === ADMIN_NAME;
  document.getElementById('leaderboardBtnRow').style.display = isAdmin ? 'flex' : 'none';
  if (isAdmin) userName = val;
});
</script>
</body>
</html>
